<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>智慧城市 · 参考实现</title>
<script src="assets/api-mode.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --pri: #1677ff; --pri-2: #4b9bff; --txt: #14202e; --txt2: #5c6b7f; --txt3: #97a3b4;
    --bg: #f4f6fa; --card: #fff; --line: #eceff4; --danger: #f5544b; --ok: #17b26a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--txt); font-size: 14px; line-height: 1.5;
  }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }

  .statusbar {
    height: 46px; flex: 0 0 46px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 20px 5px; font-size: 12px; font-weight: 600; background: #fff; color: #101828;
  }
  .statusbar .sb-r { display: flex; gap: 5px; align-items: center; font-size: 11px; }
  .sb-bat { width: 20px; height: 10px; border: 1px solid #101828; border-radius: 3px; position: relative; }
  .sb-bat::after { content: ''; position: absolute; inset: 1.5px; right: 5px; background: #101828; border-radius: 1px; }

  header.nav {
    flex: 0 0 auto; background: #fff; padding: 4px 16px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; position: relative; z-index: 5;
  }
  header.nav .t { font-size: 17px; font-weight: 650; letter-spacing: -.2px; flex: 1; }
  header.nav .back {
    width: 28px; height: 28px; display: none; align-items: center; justify-content: center;
    cursor: pointer; margin-left: -6px; color: var(--txt);
  }
  header.nav .back.on { display: flex; }
  header.nav .act { color: var(--pri); font-size: 12.5px; cursor: pointer; }

  main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  main::-webkit-scrollbar { display: none; }

  .apihint {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; color: #8a97a8;
    background: #eef2f7; padding: 3px 12px; letter-spacing: -.1px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .apihint b { color: var(--pri); font-weight: 700; }

  .tabbar {
    flex: 0 0 58px; background: rgba(255,255,255,.96); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); display: flex; padding-bottom: 4px; z-index: 6;
  }
  .tabbar div {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 10px; color: #9aa6b6; cursor: pointer;
  }
  .tabbar div.on { color: var(--pri); font-weight: 600; }
  .tabbar svg { width: 21px; height: 21px; stroke-width: 1.8; }

  /* 轮播 */
  .banner { padding: 12px 14px 4px; }
  .banner .track { position: relative; height: 148px; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 18px rgba(20,40,80,.12); }
  .banner .track img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; font-size: 12.5px; font-weight: 500;
  }
  .dots { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }
  .dots i { width: 5px; height: 5px; border-radius: 3px; background: #ccd4e0; transition: .25s; }
  .dots i.on { width: 14px; background: var(--pri); }

  /* 宫格 */
  .grid8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; padding: 14px 8px 6px; background: #fff; margin: 10px 14px; border-radius: 14px; }
  .grid8 a { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: var(--txt2); font-size: 11px; cursor: pointer; }
  .grid8 img { width: 30px; height: 30px; object-fit: contain; }
  .grid8 .sico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #eaf3ff, #dcebff); color: var(--pri); }
  .grid8 .sico svg { width: 22px; height: 22px; }
  .grid8 .em { width: 30px; height: 30px; display: grid; place-items: center; font-size: 17px; }

  .sec { padding: 12px 16px 6px; display: flex; align-items: center; gap: 8px; }
  .sec h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .sec .more { margin-left: auto; font-size: 11.5px; color: var(--txt3); }

  .news { background: #fff; margin: 0 14px 10px; border-radius: 12px; overflow: hidden; }
  .news .it { display: flex; gap: 11px; padding: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .news .it:last-child { border-bottom: 0; }
  .news .it img { width: 96px; height: 68px; border-radius: 8px; object-fit: cover; flex: 0 0 96px; background: #eef2f7; }
  .news .it .c { min-width: 0; display: flex; flex-direction: column; }
  .news .it .ti { font-size: 13.5px; font-weight: 550; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .news .it .mt { margin-top: auto; font-size: 10.5px; color: var(--txt3); display: flex; gap: 8px; }

  /* 通用列表卡 */
  .card-list { padding: 10px 14px 20px; display: flex; flex-direction: column; gap: 11px; }
  .item {
    background: #fff; border-radius: 13px; padding: 11px; display: flex; gap: 11px;
    box-shadow: 0 2px 10px rgba(20,40,80,.05); cursor: pointer;
  }
  .item img { width: 84px; height: 84px; border-radius: 9px; object-fit: cover; flex: 0 0 84px; background: #eef2f7; }
  .item .c { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .item .h { font-size: 14px; font-weight: 620; display: flex; align-items: center; gap: 6px; }
  .item .d { font-size: 11.5px; color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .f { margin-top: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--txt3); }
  .price { color: var(--danger); font-weight: 700; font-size: 14px; }
  .price small { font-size: 10px; font-weight: 500; }
  .pill { font-size: 10px; padding: 1px 6px; border-radius: 20px; background: #eaf3ff; color: var(--pri); }
  .pill.gray { background: #f1f3f7; color: #8a97a8; }
  .pill.red { background: #ffecea; color: var(--danger); }
  .pill.green { background: #e7f8ef; color: var(--ok); }
  .star { color: #ff9f1c; font-size: 11px; }

  /* 详情层 */
  .sheet {
    position: absolute; inset: 0; background: var(--bg); z-index: 40; display: none;
    flex-direction: column; transform: translateX(100%); transition: transform .26s ease;
  }
  .sheet.on { display: flex; transform: translateX(0); }
  .sheet .sh { padding: 8px 16px 12px; display: flex; align-items: center; gap: 10px; background: #fff; border-bottom: 1px solid var(--line); }
  .sheet .sh .b { width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; margin-left: -6px; }
  .sheet .sh .t { font-size: 16px; font-weight: 620; flex: 1; }
  .sheet .sb { flex: 1; overflow-y: auto; padding-bottom: 30px; }
  .sheet .sb::-webkit-scrollbar { display: none; }
  .article { background: #fff; padding: 16px; }
  .article h1 { font-size: 19px; margin: 0 0 10px; line-height: 1.45; }
  .article .meta { font-size: 11px; color: var(--txt3); margin-bottom: 14px; display: flex; gap: 10px; }
  .article .body { font-size: 14.5px; line-height: 1.85; color: #2b3a4d; }
  .article .body img { max-width: 100%; border-radius: 8px; }

  .hero-img { width: 100%; height: 190px; object-fit: cover; display: block; }
  .pad { padding: 14px 16px; }
  .rows { background: #fff; border-radius: 12px; margin: 10px 14px; overflow: hidden; }
  .rows .r { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rows .r:last-child { border-bottom: 0; }
  .rows .r .k { color: var(--txt2); width: 82px; flex: 0 0 82px; font-size: 12.5px; }
  .rows .r .v { flex: 1; text-align: right; font-weight: 500; }

  .tabchips { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; background: #fff; }
  .tabchips::-webkit-scrollbar { display: none; }
  .tabchips span { flex: 0 0 auto; padding: 5px 13px; border-radius: 20px; background: #f2f4f8; font-size: 12px; color: var(--txt2); cursor: pointer; }
  .tabchips span.on { background: var(--pri); color: #fff; font-weight: 600; }

  .linecard { background: #fff; border-radius: 13px; padding: 13px; margin: 0 14px 10px; box-shadow: 0 2px 10px rgba(20,40,80,.05); cursor: pointer; }
  .linecard .top { display: flex; align-items: center; gap: 9px; }
  .linecard .no { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: 0 0 34px; }
  .linecard .nm { font-size: 14px; font-weight: 620; }
  .linecard .sub { font-size: 11px; color: var(--txt3); margin-top: 1px; }
  .linecard .st { margin-top: 10px; display: flex; gap: 16px; font-size: 11px; color: var(--txt2); border-top: 1px dashed var(--line); padding-top: 9px; }
  .linecard .st b { color: var(--txt); font-weight: 600; }

  .stop { display: flex; gap: 12px; padding: 0 14px; }
  .stop .rail { width: 14px; flex: 0 0 14px; display: flex; flex-direction: column; align-items: center; }
  .stop .rail .ln { width: 3px; flex: 1; background: #d7e0ec; }
  .stop .rail .pt { width: 11px; height: 11px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #b9c6d8; background: #b9c6d8; margin: 4px 0; }
  .stop .rail .pt.x { background: #fff; box-shadow: 0 0 0 2px var(--pri); }
  .stop .body2 { flex: 1; padding: 2px 0 16px; border-bottom: 1px solid var(--line); }
  .stop .nm { font-size: 13.5px; font-weight: 550; }
  .stop .tg { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }

  .film-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 14px 20px; }
  .film { cursor: pointer; }
  .film img { width: 100%; aspect-ratio: .72; object-fit: cover; border-radius: 10px; background: #e9eef5; display: block; }
  .film .n { font-size: 13px; font-weight: 550; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .film .s { font-size: 11px; color: #ff9f1c; }

  .btn2 {
    display: block; width: calc(100% - 28px); margin: 14px; padding: 12px; border: 0; border-radius: 11px;
    background: linear-gradient(135deg, var(--pri), #3f8cff); color: #fff; font-size: 14.5px;
    font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(22,119,255,.28);
  }
  .btn2:disabled { background: #c6d2e2; box-shadow: none; }

  .sk { background: linear-gradient(90deg, #eef1f6 25%, #f7f9fc 37%, #eef1f6 63%); background-size: 400% 100%; animation: sh 1.3s infinite; border-radius: 6px; }
  @keyframes sh { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .skeleton { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

  .empty2 { text-align: center; color: #9aa6b6; font-size: 12.5px; padding: 50px 20px; }
  .toast2 {
    position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(20,32,46,.9);
    color: #fff; font-size: 12.5px; padding: 8px 16px; border-radius: 20px; z-index: 90; opacity: 0;
    transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  .toast2.on { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="statusbar"><span>9:41</span><span class="sb-r">●●● 5G <span class="sb-bat"></span></span></div>
  <header class="nav">
    <div class="back" id="navBack"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="t" id="navTitle">智慧城市</div>
    <div class="act" id="navAct">搜索</div>
  </header>
  <div class="apihint" id="apiHint"></div>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <div data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>首页</div>
    <div data-go="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>资讯</div>
    <div data-go="park"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 010 6H9"/></svg>停车</div>
    <div data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>我的</div>
  </nav>
  <div class="toast2" id="toast2"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const TOKEN = () => { try { return JSON.parse(localStorage.getItem('sc_token')) || ''; } catch { return ''; } };

let cur = { page: 'home', stack: [] };

function toast2(m) {
  const t = $('#toast2'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600);
}

async function api(path) {
  const h = {}; const tk = TOKEN(); if (tk) h.Authorization = tk;
  try {
    const r = await fetch('/prod-api' + path, { headers: h });
    return await r.json();
  } catch (e) { return { code: 500, msg: '网络异常' }; }
}

function hint(method, path) {
  $('#apiHint').innerHTML = `<b>${method}</b> /prod-api${esc(path)}`;
}
function skel(n = 4) {
  return `<div class="skeleton">${Array.from({length:n}, () => `
    <div style="display:flex;gap:11px"><div class="sk" style="width:84px;height:84px;border-radius:9px"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="sk" style="height:14px;width:70%"></div>
    <div class="sk" style="height:11px;width:90%"></div><div class="sk" style="height:11px;width:50%"></div></div></div>`).join('')}</div>`;
}

/* ------------------------------ 首页 ------------------------------ */
async function pageHome() {
  $('#navTitle').textContent = '智慧城市';
  $('#navAct').textContent = '搜索';
  $('#navBack').classList.remove('on');
  hint('GET', '/api/rotation/list + /api/service/list + /press/press/list');
  $('#main').innerHTML = `<div class="banner"><div class="track sk" style="border-radius:14px"></div></div>
    <div class="grid8">${Array.from({length:8}, () => '<div class="sk" style="height:44px"></div>').join('')}</div>
    ${skel(4)}`;

  const [rot, svc, press] = await Promise.all([
    api('/api/rotation/list?type=2'),
    api('/api/service/list'),
    api('/press/press/list?pageNum=1&pageSize=6&type=16'),
  ]);
  const banners = (rot.rows || []).slice(0, 5);
  const services = (svc.rows || []).slice(0, 7);
  const news = press.rows || [];

  const SVGICON = {
    '停车场': '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9.5 17V7.5h4.2a3 3 0 010 6H9.5"/>',
    '城市地铁': '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21l2-3M16 21l-2-3M5 11h14M9 7h6"/>',
    '外卖订餐': '<path d="M4 10h16l-1.6 9.2A2 2 0 0116.4 21H7.6a2 2 0 01-2-1.8L4 10z"/><path d="M8 10a4 4 0 018 0"/>',
    '找工作': '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 12h18"/>',
    '找房子': '<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
    '智慧交管': '<path d="M12 3l8 4v5c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>',
    '活动管理': '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17h6"/>',
    '生活交费': '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
    '看电影': '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><path d="M10 13l4 2.5-4 2.5z"/>',
    '门诊预约': '<path d="M12 3v18M3 12h18"/>',
  };
  const routes = { '停车场': 'park', '城市地铁': 'metro', '外卖订餐': 'food', '看电影': 'movie', '生活交费': 'me', '活动管理': 'me', '找工作': 'me', '找房子': 'me', '智慧交管': 'me' };

  $('#main').innerHTML = `
    <div class="banner">
      <div class="track" id="bTrack"><img src="${banners[0]?.advImg || ''}" alt="" /></div>
      <div class="dots" id="bDots">${banners.map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>
    </div>
    <div class="grid8" id="g8">
      ${services.map((s) => `<a data-r="${routes[s.serviceName] || ''}" data-n="${esc(s.serviceName)}">
        <span class="sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${SVGICON[s.serviceName] || SVGICON['活动管理']}</svg></span>
        <span>${esc(s.serviceName)}</span></a>`).join('')}
      <a data-n="全部分类"><span class="sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="18" cy="6" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/><circle cx="6" cy="18" r="1.4"/><circle cx="12" cy="18" r="1.4"/><circle cx="18" cy="18" r="1.4"/></svg></span><span>全部分类</span></a>
    </div>
    <div class="sec"><h3>今日要闻</h3><span class="more">查看更多 ›</span></div>
    <div class="news" id="newsList">
      ${news.map((n) => `<div class="it" data-id="${n.id}">
        <div class="c"><div class="ti">${esc(n.title)}</div>
          <div class="mt"><span>${esc(n.publishDate || '')}</span><span>阅读 ${n.readNum || 0}</span></div></div>
        <img src="${n.cover}" alt="" /></div>`).join('')}
    </div>
    <div style="height:16px"></div>`;

  // 轮播自动播放
  let bi = 0;
  clearInterval(window._bt);
  if (banners.length > 1) {
    window._bt = setInterval(() => {
      bi = (bi + 1) % banners.length;
      const img = $('#bTrack img'); if (!img) return;
      img.style.opacity = 0;
      setTimeout(() => { img.src = banners[bi].advImg; img.style.opacity = 1; }, 160);
      document.querySelectorAll('#bDots i').forEach((d, i) => d.classList.toggle('on', i === bi));
    }, 3200);
  }
  $('#bTrack').onclick = () => toast2('轮播跳转：' + (banners[bi]?.servModule || '新闻资讯'));
  $('#g8').onclick = (e) => {
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.r) go(a.dataset.r);
    else toast2(a.dataset.n + ' 模块待实现');
  };
  $('#newsList').onclick = (e) => {
    const it = e.target.closest('.it'); if (!it) return;
    openArticle(it.dataset.id, news);
  };
}

/* ------------------------------ 资讯 ------------------------------ */
async function pageNews() {
  $('#navTitle').textContent = '资讯';
  $('#navAct').textContent = '筛选';
  $('#navBack').classList.remove('on');
  hint('GET', '/press/press/list?type=16');
  $('#main').innerHTML = skel(5);
  const r = await api('/press/press/list?pageNum=1&pageSize=20&type=16');
  const list = r.rows || [];
  $('#main').innerHTML = `<div class="news" style="margin-top:10px">
    ${list.map((n) => `<div class="it" data-id="${n.id}">
      <div class="c"><div class="ti">${esc(n.title)}</div>
        <div class="mt"><span class="pill">${esc(n.typeName || '要闻')}</span><span>${n.commentNum || 0} 评论</span><span>${n.readNum || 0} 阅读</span></div></div>
      <img src="${n.cover}" alt="" /></div>`).join('')}
    </div><div class="empty2">已经到底了</div>`;
  $('#main').onclick = (e) => {
    const it = e.target.closest('.it'); if (!it) return;
    openArticle(it.dataset.id, list);
  };
}

const sheet = (title, html) => {
  const d = document.createElement('div');
  d.className = 'sheet on';
  d.innerHTML = `<div class="statusbar" style="background:#fff"><span>9:41</span><span class="sb-r">●●● 5G <span class="sb-bat"></span></span></div>

        <span>配送费 ¥${s.deliveryFee}</span></div>
    </div>
    <div class="sec"><h3>热销菜品</h3><span class="more">共 ${items.length} 件</span></div>
    <div class="card-list">
      ${items.map((p) => `<div class="item" style="padding:9px">
        <img src="${p.imgUrl}" style="width:68px;height:68px;flex:0 0 68px" alt="" />
        <div class="c"><div class="h" style="font-size:13.5px">${esc(p.name)}</div>
          <div class="d">${esc(p.introduction)}</div>
          <div class="f"><span class="price"><small>¥</small>${p.price}</span><span>月售 ${p.saleQuantity}</span>
            <button class="pill" style="margin-left:auto;border:0;padding:5px 12px;cursor:pointer" data-add="${p.id}">＋</button></div></div>
      </div>`).join('')}
    </div>
    <button class="btn2" id="payBtn" disabled>¥0.00 去结算</button>`;
  let sum = 0, cnt = 0;
  d.querySelector('.sb').onclick = (e) => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    const p = items.find((x) => String(x.id) === b.dataset.add);

    const btn = d.querySelector('#payBtn');
    btn.disabled = false; btn.textContent = `¥${sum.toFixed(2)} 去结算（${cnt} 件）`;
    toast2('已加入购物车');
  };

  const r = await api('/api/metro/line/' + l.id);

  const stops = Array.isArray(raw) ? raw : (raw.stationList || raw.list || []);
  const names = stops.length ? stops.map((s) => s.name) : ['西苑','北宫门','安河桥北','海淀黄庄','人民大学','魏公村','国家图书馆'];
  d.querySelector('.sb').innerHTML = `
    <div class="pad" style="background:#fff;border-bottom:1px solid #eceff4">
      <div style="font-size:16px;font-weight:650">${esc(l.name)}</div>
      <div style="font-size:12px;color:#5c6b7f;margin-top:3px">${esc(l.first)} → ${esc(l.end)} · ${l.km} 公里</div>
    </div>
    <div style="height:14px"></div>
    ${names.map((n, i) => `<div class="stop">
      <div class="rail"><div class="ln" style="${i === 0 ? 'opacity:0' : ''}"></div>
        <div class="pt ${i === 0 || i === names.length - 1 ? 'x' : ''}"></div>
        <div class="ln" style="${i === names.length - 1 ? 'opacity:0' : ''}"></div></div>
      <div class="body2"><div class="nm">${esc(n)}</div>
        <div class="tg">${i % 4 === 3 ? '<span class="pill">换乘站</span><span class="pill gray">2 号线</span>' : ''}
        ${i === 0 || i === names.length - 1 ? '<span class="pill green">首末站</span>' : ''}</div></div>
    </div>`).join('')}`;
}

/* ------------------------------ 路由 ------------------------------ */
const PAGES = { home: pageHome, news: pageNews, park: pagePark, food: pageFood, metro: pageMetro, movie: pageMovie, me: pageMe };

function go(page) {
  if (!PAGES[page]) return;
  cur.page = page;
  document.querySelectorAll('#tabbar div').forEach((d) => d.classList.toggle('on', d.dataset.go === page));
  PAGES[page]();
}

document.querySelectorAll('#tabbar div').forEach((d) => d.onclick = () => go(d.dataset.go));
window.addEventListener('message', (e) => {
  if (e.data?.type === 'goto') go(e.data.page);
});
(async () => { if (window.API_READY) { try { await window.API_READY; } catch {} } await go('home'); })();
</script>
