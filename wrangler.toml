name = "smart-city-mock"
main = "worker/index.mjs"
compatibility_date = "2026-10-01"

# 关闭 workers.dev，只保留自定义域名
workers_dev = false

# 自定义域名（Cloudflare 账号内已绑定的 zone）
routes = [
  { pattern = "api.qixingba.dpdns.org", custom_domain = true },
  { pattern = "qixingba.dpdns.org/*", zone_name = "qixingba.dpdns.org" }
]

# 静态站点（练习平台网页）与 API 同域：/prod-api、/mock 走 Worker，其余走静态资源
[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/prod-api/*", "/mock/*", "/"]

[vars]
ASSET_BASE = "https://api.qixingba.dpdns.org"

[observability]
enabled = true

# ---------------------------------------------------------------- D1
[[d1_databases]]
binding = "DB"
database_name = "smart-city-mock"
database_id = "a9df764d-f8f2-423c-a09d-72adce276573"
